# Yerel geliştirme / tek sunucu dağıtımı.
# Coolify'da: App = Dockerfile build, Postgres = ayrı Coolify "Database"
# servisi (bu compose lokal test ve referans içindir).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pvsim
      POSTGRES_PASSWORD: pvsim
      POSTGRES_DB: pvsim
    volumes:
      - pvsim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvsim"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pvsim:pvsim@db:5432/pvsim
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-openssl-rand-base64-32
      AUTH_TRUST_HOST: "true"
      DEV_LOGIN_EMAIL: dev@yesilsertifika.tech
      DEV_LOGIN_PASSWORD: changeme
      PVGIS_BASE_URL: https://re.jrc.ec.europa.eu/api/v5_2
      SIM_RATE_LIMIT_PER_HOUR: "50"
    ports:
      - "3000:3000"

volumes:
  pvsim_pgdata:
